name: Desktop CI

on:
  push:
    paths:
      - ".github/workflows/desktop-ci.yml"
      - "ARM_BUILD_README.md"
      - "CMakeLists.txt"
      - "README.md"
      - "VERSION.txt"
      - "backend/**"
      - "build-linux-arm64.command"
      - "cmake/**"
      - "packaging/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/desktop-ci.yml"
      - "ARM_BUILD_README.md"
      - "CMakeLists.txt"
      - "README.md"
      - "VERSION.txt"
      - "backend/**"
      - "build-linux-arm64.command"
      - "cmake/**"
      - "packaging/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  QT_VERSION: "6.10.2"
  AQT_VERSION: "3.3.0"

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux AppImage (x86_64)
    runs-on: ubuntu-22.04
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Read version
        id: version
        run: echo "app_version=$(tr -d '\r\n' < VERSION.txt)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore Rust cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('backend/Cargo.lock', 'backend/Cargo.toml', 'backend/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Install system build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake curl desktop-file-utils libgl1-mesa-dev libxcb-cursor0 ninja-build patchelf zip

      - name: Install Qt
        run: |
          python -m pip install --upgrade pip
          python -m pip install "aqtinstall==${AQT_VERSION}"
          python -m aqt install-qt linux desktop "${QT_VERSION}" linux_gcc_64 --outputdir "${RUNNER_TEMP}/qt"
          echo "${RUNNER_TEMP}/qt/${QT_VERSION}/linux_gcc_64/bin" >> "$GITHUB_PATH"
          {
            echo "QT_ROOT_DIR=${RUNNER_TEMP}/qt/${QT_VERSION}/linux_gcc_64"
            echo "QT_PREFIX=${RUNNER_TEMP}/qt/${QT_VERSION}/linux_gcc_64"
            echo "Qt6_DIR=${RUNNER_TEMP}/qt/${QT_VERSION}/linux_gcc_64/lib/cmake/Qt6"
            echo "CMAKE_PREFIX_PATH=${RUNNER_TEMP}/qt/${QT_VERSION}/linux_gcc_64"
          } >> "$GITHUB_ENV"

      - name: Package AppImage
        run: ./scripts/package-appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v6
        with:
          name: MatrixMediaArchiverQt-${{ steps.version.outputs.app_version }}-linux-x86_64-appimage
          path: builds/MatrixMediaArchiverQt-${{ steps.version.outputs.app_version }}-linux-x86_64-appimage.zip
          if-no-files-found: error

  build-linux-arm64:
    name: Build Linux AppImage (arm64)
    runs-on: ubuntu-24.04-arm
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Read version
        id: version
        run: echo "app_version=$(tr -d '\r\n' < VERSION.txt)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore Rust cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('backend/Cargo.lock', 'backend/Cargo.toml', 'backend/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Install system build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake curl desktop-file-utils libgl1-mesa-dev libxcb-cursor0 ninja-build patchelf zip

      - name: Install Qt
        run: |
          python -m pip install --upgrade pip
          python -m pip install "aqtinstall==${AQT_VERSION}"
          python -m aqt install-qt linux_arm64 desktop "${QT_VERSION}" linux_gcc_arm64 --outputdir "${RUNNER_TEMP}/qt"
          echo "${RUNNER_TEMP}/qt/${QT_VERSION}/linux_gcc_arm64/bin" >> "$GITHUB_PATH"
          {
            echo "QT_ROOT_DIR=${RUNNER_TEMP}/qt/${QT_VERSION}/linux_gcc_arm64"
            echo "QT_PREFIX=${RUNNER_TEMP}/qt/${QT_VERSION}/linux_gcc_arm64"
            echo "Qt6_DIR=${RUNNER_TEMP}/qt/${QT_VERSION}/linux_gcc_arm64/lib/cmake/Qt6"
            echo "CMAKE_PREFIX_PATH=${RUNNER_TEMP}/qt/${QT_VERSION}/linux_gcc_arm64"
          } >> "$GITHUB_ENV"

      - name: Package AppImage
        run: ARCH=aarch64 ./scripts/package-appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v6
        with:
          name: MatrixMediaArchiverQt-${{ steps.version.outputs.app_version }}-linux-aarch64-appimage
          path: builds/MatrixMediaArchiverQt-${{ steps.version.outputs.app_version }}-linux-aarch64-appimage.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Read version
        id: version
        run: |
          $version = (Get-Content VERSION.txt -Raw).Trim()
          "app_version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore Rust cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('backend/Cargo.lock', 'backend/Cargo.toml', 'backend/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Install Qt
        run: |
          python -m pip install --upgrade pip
          python -m pip install "aqtinstall==$env:AQT_VERSION"
          python -m aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 --outputdir "$env:RUNNER_TEMP\qt"
          $qtRoot = Join-Path $env:RUNNER_TEMP "qt\$env:QT_VERSION\win64_msvc2022_64"
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $qtRoot "bin")
          @(
            "QT_ROOT_DIR=$qtRoot"
            "Qt6_DIR=$(Join-Path $qtRoot 'lib\cmake\Qt6')"
            "CMAKE_PREFIX_PATH=$qtRoot"
          ) | Add-Content -Path $env:GITHUB_ENV

      - name: Package Windows zip
        run: ./scripts/package-windows.ps1

      - name: Upload Windows zip
        uses: actions/upload-artifact@v6
        with:
          name: MatrixMediaArchiverQt-${{ steps.version.outputs.app_version }}-windows-x64
          path: builds/MatrixMediaArchiverQt-${{ steps.version.outputs.app_version }}-windows-x64.zip
          if-no-files-found: error

  build-windows-arm64:
    name: Build Windows (arm64)
    runs-on: windows-11-arm
    defaults:
      run:
        shell: pwsh
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Read version
        id: version
        run: |
          $version = (Get-Content VERSION.txt -Raw).Trim()
          "app_version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore Rust cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('backend/Cargo.lock', 'backend/Cargo.toml', 'backend/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Install Qt
        run: |
          python -m pip install --upgrade pip
          python -m pip install "aqtinstall==$env:AQT_VERSION"
          python -m aqt install-qt windows_arm64 desktop $env:QT_VERSION win64_msvc2022_arm64 --outputdir "$env:RUNNER_TEMP\qt"
          $qtRoot = Join-Path $env:RUNNER_TEMP "qt\$env:QT_VERSION\win64_msvc2022_arm64"
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $qtRoot "bin")
          @(
            "QT_ROOT_DIR=$qtRoot"
            "Qt6_DIR=$(Join-Path $qtRoot 'lib\cmake\Qt6')"
            "CMAKE_PREFIX_PATH=$qtRoot"
          ) | Add-Content -Path $env:GITHUB_ENV

      - name: Package Windows zip
        run: |
          $env:WINDOWS_ARCH = "arm64"
          ./scripts/package-windows.ps1

      - name: Upload Windows zip
        uses: actions/upload-artifact@v6
        with:
          name: MatrixMediaArchiverQt-${{ steps.version.outputs.app_version }}-windows-arm64
          path: builds/MatrixMediaArchiverQt-${{ steps.version.outputs.app_version }}-windows-arm64.zip
          if-no-files-found: error

  build-macos:
    name: Build macOS (arm64)
    runs-on: macos-14
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Read version
        id: version
        run: echo "app_version=$(tr -d '\r\n' < VERSION.txt)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore Rust cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('backend/Cargo.lock', 'backend/Cargo.toml', 'backend/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Install Qt
        run: |
          python -m pip install --upgrade pip
          python -m pip install "aqtinstall==${AQT_VERSION}"
          python -m aqt install-qt mac desktop "${QT_VERSION}" clang_64 --outputdir "${RUNNER_TEMP}/qt"
          echo "${RUNNER_TEMP}/qt/${QT_VERSION}/clang_64/bin" >> "$GITHUB_PATH"
          {
            echo "QT_ROOT_DIR=${RUNNER_TEMP}/qt/${QT_VERSION}/clang_64"
            echo "QT_PREFIX=${RUNNER_TEMP}/qt/${QT_VERSION}/clang_64"
            echo "Qt6_DIR=${RUNNER_TEMP}/qt/${QT_VERSION}/clang_64/lib/cmake/Qt6"
            echo "CMAKE_PREFIX_PATH=${RUNNER_TEMP}/qt/${QT_VERSION}/clang_64"
          } >> "$GITHUB_ENV"

      - name: Package macOS zip
        run: ./scripts/package-macos.sh

      - name: Upload macOS zip
        uses: actions/upload-artifact@v6
        with:
          name: MatrixMediaArchiverQt-${{ steps.version.outputs.app_version }}-macos-arm64
          path: builds/MatrixMediaArchiverQt-${{ steps.version.outputs.app_version }}-macos-arm64.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master'))
    needs:
      - build-linux
      - build-linux-arm64
      - build-windows
      - build-windows-arm64
      - build-macos
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v5
        with:
          name: MatrixMediaArchiverQt-${{ needs.build-linux.outputs.app_version }}-linux-x86_64-appimage
          path: release-artifacts/linux

      - name: Download Linux ARM64 artifact
        uses: actions/download-artifact@v5
        with:
          name: MatrixMediaArchiverQt-${{ needs.build-linux-arm64.outputs.app_version }}-linux-aarch64-appimage
          path: release-artifacts/linux-arm64

      - name: Download Windows artifact
        uses: actions/download-artifact@v5
        with:
          name: MatrixMediaArchiverQt-${{ needs.build-windows.outputs.app_version }}-windows-x64
          path: release-artifacts/windows

      - name: Download Windows ARM64 artifact
        uses: actions/download-artifact@v5
        with:
          name: MatrixMediaArchiverQt-${{ needs.build-windows-arm64.outputs.app_version }}-windows-arm64
          path: release-artifacts/windows-arm64

      - name: Download macOS artifact
        uses: actions/download-artifact@v5
        with:
          name: MatrixMediaArchiverQt-${{ needs.build-macos.outputs.app_version }}-macos-arm64
          path: release-artifacts/macos

      - name: Create or update latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP_VERSION: ${{ needs.build-linux.outputs.app_version }}
        run: |
          tag="v${APP_VERSION}"
          title="MatrixMediaArchiverQt ${APP_VERSION}"
          notes="Automated desktop release for ${APP_VERSION}."
          mapfile -d '' assets < <(find release-artifacts -type f -print0)
          if gh release view "${tag}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            gh release edit "${tag}" --repo "${GH_REPO}" --title "${title}" --notes "${notes}" --latest
            gh release upload "${tag}" --repo "${GH_REPO}" "${assets[@]}" --clobber
          else
            gh release create "${tag}" --repo "${GH_REPO}" "${assets[@]}" --title "${title}" --notes "${notes}" --latest --target "${GITHUB_SHA}"
          fi
