name: Desktop CI

on:
  push:
    paths:
      - ".github/workflows/desktop-ci.yml"
      - "ARM_BUILD_README.md"
      - "CMakeLists.txt"
      - "README.md"
      - "VERSION.txt"
      - "backend/**"
      - "build-linux-arm64.command"
      - "cmake/**"
      - "packaging/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/desktop-ci.yml"
      - "ARM_BUILD_README.md"
      - "CMakeLists.txt"
      - "README.md"
      - "VERSION.txt"
      - "backend/**"
      - "build-linux-arm64.command"
      - "cmake/**"
      - "packaging/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

# Date.build is assigned only on the publish path (push to main/master or
# workflow_dispatch). Pull requests and other test runs leave VERSION.txt
# alone so they do not consume a release number. CI must not commit
# VERSION.txt (that path filter would loop).

jobs:
  assign-version:
    name: Prepare version
    runs-on: ubuntu-22.04
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      should_stamp: ${{ steps.version.outputs.should_stamp }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Test version helper
        run: python3 tests/test_next_app_version.py -v

      - name: Select app version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) }}
        run: |
          set -euo pipefail
          if [[ "${PUBLISH}" == "true" ]]; then
            version="$(python3 scripts/next-app-version.py --strict | tr -d '\r\n')"
            should_stamp=true
            echo "Assigned next release version ${version} (America/Chicago date.build)"
          else
            version="$(tr -d '\r\n' < VERSION.txt)"
            should_stamp=false
            echo "Non-publish CI; leaving VERSION.txt as ${version}"
          fi
          if [[ ! "${version}" =~ ^[1-9][0-9]*\.[1-9][0-9]*\.[1-9][0-9]*\.[1-9][0-9]*$ ]]; then
            echo "Refusing invalid date.build version: ${version}" >&2
            exit 1
          fi
          echo "app_version=${version}" >> "${GITHUB_OUTPUT}"
          echo "should_stamp=${should_stamp}" >> "${GITHUB_OUTPUT}"

  build-linux:
    name: Build Linux AppImage (x86_64)
    needs: assign-version
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Stamp release VERSION.txt
        if: needs.assign-version.outputs.should_stamp == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.assign-version.outputs.app_version }}'
          printf '%s\n' "${version}" > VERSION.txt
          stamped="$(tr -d '\r\n' < VERSION.txt)"
          if [[ "${stamped}" != "${version}" ]]; then
            echo "VERSION.txt mismatch: '${stamped}' != '${version}'" >&2
            exit 1
          fi
          echo "Stamped VERSION.txt with ${stamped} for publish"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore Rust cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('backend/Cargo.lock', 'backend/Cargo.toml', 'backend/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Install system build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake curl desktop-file-utils libgl1-mesa-dev libxcb-cursor0 ninja-build patchelf zip

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.2"
          arch: "linux_gcc_64"
          cache: "true"
          setup-python: "false"

      - name: Package AppImage
        run: ./scripts/package-appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v6
        with:
          name: MatrixMediaArchiverQt-${{ needs.assign-version.outputs.app_version }}-linux-x86_64-appimage
          path: builds/MatrixMediaArchiverQt-${{ needs.assign-version.outputs.app_version }}-linux-x86_64-appimage.zip
          if-no-files-found: error

  build-linux-arm64:
    name: Build Linux AppImage (arm64)
    needs: assign-version
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Stamp release VERSION.txt
        if: needs.assign-version.outputs.should_stamp == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.assign-version.outputs.app_version }}'
          printf '%s\n' "${version}" > VERSION.txt
          stamped="$(tr -d '\r\n' < VERSION.txt)"
          if [[ "${stamped}" != "${version}" ]]; then
            echo "VERSION.txt mismatch: '${stamped}' != '${version}'" >&2
            exit 1
          fi
          echo "Stamped VERSION.txt with ${stamped} for publish"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore Rust cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('backend/Cargo.lock', 'backend/Cargo.toml', 'backend/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Install system build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake curl desktop-file-utils libgl1-mesa-dev libxcb-cursor0 ninja-build patchelf zip

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.2"
          host: "linux_arm64"
          arch: "linux_gcc_arm64"
          cache: "true"
          setup-python: "false"

      - name: Package AppImage
        run: ARCH=aarch64 ./scripts/package-appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v6
        with:
          name: MatrixMediaArchiverQt-${{ needs.assign-version.outputs.app_version }}-linux-aarch64-appimage
          path: builds/MatrixMediaArchiverQt-${{ needs.assign-version.outputs.app_version }}-linux-aarch64-appimage.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows (x64)
    needs: assign-version
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Stamp release VERSION.txt
        if: needs.assign-version.outputs.should_stamp == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.assign-version.outputs.app_version }}'
          printf '%s\n' "${version}" > VERSION.txt
          stamped="$(tr -d '\r\n' < VERSION.txt)"
          if [[ "${stamped}" != "${version}" ]]; then
            echo "VERSION.txt mismatch: '${stamped}' != '${version}'" >&2
            exit 1
          fi
          echo "Stamped VERSION.txt with ${stamped} for publish"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore Rust cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('backend/Cargo.lock', 'backend/Cargo.toml', 'backend/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.2"
          arch: "win64_msvc2022_64"
          cache: "true"
          setup-python: "false"

      - name: Package Windows zip
        run: ./scripts/package-windows.ps1

      - name: Upload Windows zip
        uses: actions/upload-artifact@v6
        with:
          name: MatrixMediaArchiverQt-${{ needs.assign-version.outputs.app_version }}-windows-x64
          path: builds/MatrixMediaArchiverQt-${{ needs.assign-version.outputs.app_version }}-windows-x64.zip
          if-no-files-found: error

  build-windows-arm64:
    name: Build Windows (arm64)
    needs: assign-version
    runs-on: windows-11-arm
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Stamp release VERSION.txt
        if: needs.assign-version.outputs.should_stamp == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.assign-version.outputs.app_version }}'
          printf '%s\n' "${version}" > VERSION.txt
          stamped="$(tr -d '\r\n' < VERSION.txt)"
          if [[ "${stamped}" != "${version}" ]]; then
            echo "VERSION.txt mismatch: '${stamped}' != '${version}'" >&2
            exit 1
          fi
          echo "Stamped VERSION.txt with ${stamped} for publish"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore Rust cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('backend/Cargo.lock', 'backend/Cargo.toml', 'backend/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.2"
          host: "windows_arm64"
          arch: "win64_msvc2022_arm64"
          cache: "true"
          setup-python: "false"

      - name: Package Windows zip
        run: |
          $env:WINDOWS_ARCH = "arm64"
          ./scripts/package-windows.ps1

      - name: Upload Windows zip
        uses: actions/upload-artifact@v6
        with:
          name: MatrixMediaArchiverQt-${{ needs.assign-version.outputs.app_version }}-windows-arm64
          path: builds/MatrixMediaArchiverQt-${{ needs.assign-version.outputs.app_version }}-windows-arm64.zip
          if-no-files-found: error

  build-macos:
    name: Build macOS (arm64)
    needs: assign-version
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Stamp release VERSION.txt
        if: needs.assign-version.outputs.should_stamp == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.assign-version.outputs.app_version }}'
          printf '%s\n' "${version}" > VERSION.txt
          stamped="$(tr -d '\r\n' < VERSION.txt)"
          if [[ "${stamped}" != "${version}" ]]; then
            echo "VERSION.txt mismatch: '${stamped}' != '${version}'" >&2
            exit 1
          fi
          echo "Stamped VERSION.txt with ${stamped} for publish"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore Rust cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('backend/Cargo.lock', 'backend/Cargo.toml', 'backend/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.2"
          arch: "clang_64"
          cache: "true"
          setup-python: "false"

      - name: Import Apple Developer ID certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_CERTIFICATE_BASE64}" ]]; then
            echo "APPLE_CERTIFICATE_BASE64 secret is not set." >&2
            exit 1
          fi
          if [[ -z "${APPLE_CERTIFICATE_PASSWORD}" ]]; then
            echo "APPLE_CERTIFICATE_PASSWORD secret is not set." >&2
            exit 1
          fi

          CERTIFICATE_PATH="${RUNNER_TEMP}/build_certificate.p12"
          KEYCHAIN_PATH="${RUNNER_TEMP}/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          echo "CERTIFICATE_PATH=${CERTIFICATE_PATH}" >> "${GITHUB_ENV}"
          echo "KEYCHAIN_PATH=${KEYCHAIN_PATH}" >> "${GITHUB_ENV}"

          printf '%s' "${APPLE_CERTIFICATE_BASE64}" | tr -d '[:space:]' | base64 --decode > "${CERTIFICATE_PATH}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" \
            -k "${KEYCHAIN_PATH}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -A \
            -f pkcs12 \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productsign
          security list-keychain -d user -s "${KEYCHAIN_PATH}"
          security default-keychain -s "${KEYCHAIN_PATH}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security find-identity -v -p codesigning "${KEYCHAIN_PATH}"

      - name: Package, sign, and notarize macOS app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: "Developer ID Application: BRANDON BROWNING STONE (K6N4J68LTY)"
        run: ./scripts/package-macos.sh

      - name: Upload macOS zip and dmg
        uses: actions/upload-artifact@v6
        with:
          name: MatrixMediaArchiverQt-${{ needs.assign-version.outputs.app_version }}-macos-arm64
          path: |
            builds/MatrixMediaArchiverQt-${{ needs.assign-version.outputs.app_version }}-macos-arm64.zip
            builds/MatrixMediaArchiverQt-${{ needs.assign-version.outputs.app_version }}-macos-arm64.dmg
          if-no-files-found: error

      - name: Clean up signing keychain
        if: always()
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "${KEYCHAIN_PATH}" || true
          fi
          rm -f "${CERTIFICATE_PATH:-}"

  publish-release:
    name: Publish GitHub release
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master'))
    needs:
      - assign-version
      - build-linux
      - build-linux-arm64
      - build-windows
      - build-windows-arm64
      - build-macos
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v5
        with:
          name: MatrixMediaArchiverQt-${{ needs.assign-version.outputs.app_version }}-linux-x86_64-appimage
          path: release-artifacts/linux

      - name: Download Linux ARM64 artifact
        uses: actions/download-artifact@v5
        with:
          name: MatrixMediaArchiverQt-${{ needs.assign-version.outputs.app_version }}-linux-aarch64-appimage
          path: release-artifacts/linux-arm64

      - name: Download Windows artifact
        uses: actions/download-artifact@v5
        with:
          name: MatrixMediaArchiverQt-${{ needs.assign-version.outputs.app_version }}-windows-x64
          path: release-artifacts/windows

      - name: Download Windows ARM64 artifact
        uses: actions/download-artifact@v5
        with:
          name: MatrixMediaArchiverQt-${{ needs.assign-version.outputs.app_version }}-windows-arm64
          path: release-artifacts/windows-arm64

      - name: Download macOS artifacts
        uses: actions/download-artifact@v5
        with:
          name: MatrixMediaArchiverQt-${{ needs.assign-version.outputs.app_version }}-macos-arm64
          path: release-artifacts/macos

      - name: Create or update latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP_VERSION: ${{ needs.assign-version.outputs.app_version }}
        run: |
          tag="v${APP_VERSION}"
          title="MatrixMediaArchiverQt ${APP_VERSION}"
          notes="Automated desktop release for ${APP_VERSION}."
          mapfile -d '' assets < <(find release-artifacts -type f -print0)
          if gh release view "${tag}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            gh release edit "${tag}" --repo "${GH_REPO}" --title "${title}" --notes "${notes}" --latest
            gh release upload "${tag}" --repo "${GH_REPO}" "${assets[@]}" --clobber
          else
            gh release create "${tag}" --repo "${GH_REPO}" "${assets[@]}" --title "${title}" --notes "${notes}" --latest --target "${GITHUB_SHA}"
          fi
