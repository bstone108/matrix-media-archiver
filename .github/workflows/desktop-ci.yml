name: Desktop CI

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/desktop-ci.yml"
      - "ARM_BUILD_README.md"
      - "CMakeLists.txt"
      - "README.md"
      - "VERSION.txt"
      - "backend/**"
      - "build-linux-arm64.command"
      - "cmake/**"
      - "packaging/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

# Date.build is assigned only on the publish path: a v* tag with no GitHub
# Release yet, or workflow_dispatch. Push to main/master and pull requests
# compile/package unsigned and leave VERSION.txt alone so they do not
# consume a release number. Do not put paths: on the same push that
# includes tags (path filters skip tag-triggered notary runs). CI must
# not commit VERSION.txt.

jobs:
  assign-version:
    name: Prepare version
    runs-on: ubuntu-22.04
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      should_stamp: ${{ steps.version.outputs.should_stamp }}
      skip_packaging: ${{ steps.version.outputs.skip_packaging }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Test version helper
        run: python3 tests/test_next_app_version.py -v

      - name: Test macOS unsigned-PR / signed-publish policy
        run: python3 tests/test_macos_release_policy.py -v

      - name: Select app version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
        run: |
          set -euo pipefail
          skip_packaging=false
          if [[ "${EVENT_NAME}" == "push" && "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${REF_NAME#v}"
            if gh release view "${REF_NAME}" --repo "${GH_REPO}" >/dev/null 2>&1; then
              echo "Tag ${REF_NAME} already has a GitHub release; skipping packaging/publish."
              should_stamp=false
              skip_packaging=true
            else
              should_stamp=true
              echo "Tag ${REF_NAME} has no release yet; packaging ${version} without assigning a new N."
            fi
          elif [[ "${PUBLISH}" == "true" ]]; then
            version="$(python3 scripts/next-app-version.py --strict | tr -d '\r\n')"
            should_stamp=true
            echo "Assigned next release version ${version} (America/Chicago date.build)"
          else
            version="$(tr -d '\r\n' < VERSION.txt)"
            should_stamp=false
            echo "Non-publish CI; leaving VERSION.txt as ${version}"
          fi
          if [[ ! "${version}" =~ ^[1-9][0-9]*\.[1-9][0-9]*\.[1-9][0-9]*\.[1-9][0-9]*$ ]]; then
            echo "Refusing invalid date.build version: ${version}" >&2
            exit 1
          fi
          echo "app_version=${version}" >> "${GITHUB_OUTPUT}"
          echo "should_stamp=${should_stamp}" >> "${GITHUB_OUTPUT}"
          echo "skip_packaging=${skip_packaging}" >> "${GITHUB_OUTPUT}"

  build-linux:
    name: Build Linux AppImage (x86_64)
    needs: assign-version
    if: needs.assign-version.outputs.skip_packaging != 'true'
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Stamp release VERSION.txt
        if: needs.assign-version.outputs.should_stamp == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.assign-version.outputs.app_version }}'
          printf '%s\n' "${version}" > VERSION.txt
          stamped="$(tr -d '\r\n' < VERSION.txt)"
          if [[ "${stamped}" != "${version}" ]]; then
            echo "VERSION.txt mismatch: '${stamped}' != '${version}'" >&2
            exit 1
          fi
          echo "Stamped VERSION.txt with ${stamped} for publish"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore Rust cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('backend/Cargo.lock', 'backend/Cargo.toml', 'backend/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Install system build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake curl desktop-file-utils libgl1-mesa-dev libxcb-cursor0 ninja-build patchelf zip

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.2"
          arch: "linux_gcc_64"
          cache: "true"
          setup-python: "false"

      - name: Package AppImage
        run: ./scripts/package-appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v6
        with:
          name: MatrixMediaArchiverQt-${{ needs.assign-version.outputs.app_version }}-linux-x86_64-appimage
          path: builds/MatrixMediaArchiverQt-${{ needs.assign-version.outputs.app_version }}-linux-x86_64-appimage.zip
          if-no-files-found: error

  build-linux-arm64:
    name: Build Linux AppImage (arm64)
    needs: assign-version
    if: needs.assign-version.outputs.skip_packaging != 'true'
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Stamp release VERSION.txt
        if: needs.assign-version.outputs.should_stamp == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.assign-version.outputs.app_version }}'
          printf '%s\n' "${version}" > VERSION.txt
          stamped="$(tr -d '\r\n' < VERSION.txt)"
          if [[ "${stamped}" != "${version}" ]]; then
            echo "VERSION.txt mismatch: '${stamped}' != '${version}'" >&2
            exit 1
          fi
          echo "Stamped VERSION.txt with ${stamped} for publish"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore Rust cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('backend/Cargo.lock', 'backend/Cargo.toml', 'backend/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Install system build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake curl desktop-file-utils libgl1-mesa-dev libxcb-cursor0 ninja-build patchelf zip

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.2"
          host: "linux_arm64"
          arch: "linux_gcc_arm64"
          cache: "true"
          setup-python: "false"

      - name: Package AppImage
        run: ARCH=aarch64 ./scripts/package-appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v6
        with:
          name: MatrixMediaArchiverQt-${{ needs.assign-version.outputs.app_version }}-linux-aarch64-appimage
          path: builds/MatrixMediaArchiverQt-${{ needs.assign-version.outputs.app_version }}-linux-aarch64-appimage.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows (x64)
    needs: assign-version
    if: needs.assign-version.outputs.skip_packaging != 'true'
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Stamp release VERSION.txt
        if: needs.assign-version.outputs.should_stamp == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.assign-version.outputs.app_version }}'
          printf '%s\n' "${version}" > VERSION.txt
          stamped="$(tr -d '\r\n' < VERSION.txt)"
          if [[ "${stamped}" != "${version}" ]]; then
            echo "VERSION.txt mismatch: '${stamped}' != '${version}'" >&2
            exit 1
          fi
          echo "Stamped VERSION.txt with ${stamped} for publish"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore Rust cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('backend/Cargo.lock', 'backend/Cargo.toml', 'backend/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.2"
          arch: "win64_msvc2022_64"
          cache: "true"
          setup-python: "false"

      - name: Package Windows zip
        run: ./scripts/package-windows.ps1

      - name: Upload Windows zip
        uses: actions/upload-artifact@v6
        with:
          name: MatrixMediaArchiverQt-${{ needs.assign-version.outputs.app_version }}-windows-x64
          path: builds/MatrixMediaArchiverQt-${{ needs.assign-version.outputs.app_version }}-windows-x64.zip
          if-no-files-found: error

  build-windows-arm64:
    name: Build Windows (arm64)
    needs: assign-version
    if: needs.assign-version.outputs.skip_packaging != 'true'
    runs-on: windows-11-arm
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Stamp release VERSION.txt
        if: needs.assign-version.outputs.should_stamp == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.assign-version.outputs.app_version }}'
          printf '%s\n' "${version}" > VERSION.txt
          stamped="$(tr -d '\r\n' < VERSION.txt)"
          if [[ "${stamped}" != "${version}" ]]; then
            echo "VERSION.txt mismatch: '${stamped}' != '${version}'" >&2
            exit 1
          fi
          echo "Stamped VERSION.txt with ${stamped} for publish"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore Rust cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('backend/Cargo.lock', 'backend/Cargo.toml', 'backend/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.2"
          host: "windows_arm64"
          arch: "win64_msvc2022_arm64"
          cache: "true"
          setup-python: "false"

      - name: Package Windows zip
        run: |
          $env:WINDOWS_ARCH = "arm64"
          ./scripts/package-windows.ps1

      - name: Upload Windows zip
        uses: actions/upload-artifact@v6
        with:
          name: MatrixMediaArchiverQt-${{ needs.assign-version.outputs.app_version }}-windows-arm64
          path: builds/MatrixMediaArchiverQt-${{ needs.assign-version.outputs.app_version }}-windows-arm64.zip
          if-no-files-found: error

  # PRs and push to main/master compile/package unsigned: no cert import,
  # codesign, notarytool, or stapler. Real releases (v* tag with no existing
  # GitHub Release, or workflow_dispatch) Developer ID sign, notarize, and
  # staple the .app, .dmg, and .zip. Apple Silicon uses macos-15; Intel uses
  # macos-15-intel.
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    needs: assign-version
    if: needs.assign-version.outputs.skip_packaging != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify runner architecture
        run: |
          set -euo pipefail
          actual="$(uname -m)"
          expected='${{ matrix.arch }}'
          if [[ "${actual}" != "${expected}" ]]; then
            echo "Runner arch ${actual} does not match expected ${expected} (${{ matrix.runner }})." >&2
            exit 1
          fi
          echo "Runner ${{ matrix.runner }} is ${actual}"

      - name: Stamp release VERSION.txt
        if: needs.assign-version.outputs.should_stamp == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.assign-version.outputs.app_version }}'
          printf '%s\n' "${version}" > VERSION.txt
          stamped="$(tr -d '\r\n' < VERSION.txt)"
          if [[ "${stamped}" != "${version}" ]]; then
            echo "VERSION.txt mismatch: '${stamped}' != '${version}'" >&2
            exit 1
          fi
          echo "Stamped VERSION.txt with ${stamped} for publish"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore Rust cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('backend/Cargo.lock', 'backend/Cargo.toml', 'backend/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.2"
          arch: "clang_64"
          cache: "true"
          setup-python: "false"

      - name: Package unsigned macOS app
        if: needs.assign-version.outputs.should_stamp != 'true'
        run: ./scripts/package-macos.sh

      - name: Import Apple Developer ID certificate
        if: needs.assign-version.outputs.should_stamp == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: ./scripts/import-apple-signing-cert.sh

      - name: Package, sign, and notarize macOS app
        if: needs.assign-version.outputs.should_stamp == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: "Developer ID Application: BRANDON BROWNING STONE (K6N4J68LTY)"
          MACOS_REQUIRE_NOTARIZATION: "1"
        run: ./scripts/package-macos.sh

      - name: Upload macOS zip and dmg
        uses: actions/upload-artifact@v6
        with:
          name: MatrixMediaArchiverQt-${{ needs.assign-version.outputs.app_version }}-macos-${{ matrix.arch }}
          path: |
            builds/MatrixMediaArchiverQt-${{ needs.assign-version.outputs.app_version }}-macos-${{ matrix.arch }}.zip
            builds/MatrixMediaArchiverQt-${{ needs.assign-version.outputs.app_version }}-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

      - name: Clean up signing keychain
        if: always() && needs.assign-version.outputs.should_stamp == 'true'
        run: |
          if [[ -n "${MACOS_SIGNING_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "${MACOS_SIGNING_KEYCHAIN_PATH}" || true
          fi
          rm -f "${MACOS_SIGNING_CERTIFICATE_PATH:-}"

  publish-release:
    name: Publish GitHub release
    if: needs.assign-version.outputs.skip_packaging != 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    needs:
      - assign-version
      - build-linux
      - build-linux-arm64
      - build-windows
      - build-windows-arm64
      - build-macos
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v5
        with:
          name: MatrixMediaArchiverQt-${{ needs.assign-version.outputs.app_version }}-linux-x86_64-appimage
          path: release-artifacts/linux

      - name: Download Linux ARM64 artifact
        uses: actions/download-artifact@v5
        with:
          name: MatrixMediaArchiverQt-${{ needs.assign-version.outputs.app_version }}-linux-aarch64-appimage
          path: release-artifacts/linux-arm64

      - name: Download Windows artifact
        uses: actions/download-artifact@v5
        with:
          name: MatrixMediaArchiverQt-${{ needs.assign-version.outputs.app_version }}-windows-x64
          path: release-artifacts/windows

      - name: Download Windows ARM64 artifact
        uses: actions/download-artifact@v5
        with:
          name: MatrixMediaArchiverQt-${{ needs.assign-version.outputs.app_version }}-windows-arm64
          path: release-artifacts/windows-arm64

      - name: Download macOS ARM64 artifacts
        uses: actions/download-artifact@v5
        with:
          name: MatrixMediaArchiverQt-${{ needs.assign-version.outputs.app_version }}-macos-arm64
          path: release-artifacts/macos-arm64

      - name: Download macOS Intel artifacts
        uses: actions/download-artifact@v5
        with:
          name: MatrixMediaArchiverQt-${{ needs.assign-version.outputs.app_version }}-macos-x86_64
          path: release-artifacts/macos-x86_64

      - name: Create or update latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP_VERSION: ${{ needs.assign-version.outputs.app_version }}
        run: |
          tag="v${APP_VERSION}"
          title="MatrixMediaArchiverQt ${APP_VERSION}"
          notes="Automated desktop release for ${APP_VERSION}."
          mapfile -d '' assets < <(find release-artifacts -type f -print0)
          if gh release view "${tag}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            gh release edit "${tag}" --repo "${GH_REPO}" --title "${title}" --notes "${notes}" --latest
            gh release upload "${tag}" --repo "${GH_REPO}" "${assets[@]}" --clobber
          else
            gh release create "${tag}" --repo "${GH_REPO}" "${assets[@]}" --title "${title}" --notes "${notes}" --latest --target "${GITHUB_SHA}"
          fi
